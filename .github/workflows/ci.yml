name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --all-targets --all-features
      - run: cargo test --doc --all-features
      - run: cargo run --example offline
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  bitcoin-core-regtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install pinned Bitcoin Core test binary
        working-directory: ${{ runner.temp }}
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            https://bitcoincore.org/bin/bitcoin-core-31.1/bitcoin-31.1-x86_64-linux-gnu.tar.gz \
            --output bitcoin-31.1-x86_64-linux-gnu.tar.gz
          sha256sum --check <<'SUMS'
          b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e  bitcoin-31.1-x86_64-linux-gnu.tar.gz
          SUMS
          tar -xzf bitcoin-31.1-x86_64-linux-gnu.tar.gz
          echo "BITCOIND=$RUNNER_TEMP/bitcoin-31.1/bin/bitcoind" >> "$GITHUB_ENV"
      - run: cargo test --features rpc --test rpc_regtest -- --ignored
